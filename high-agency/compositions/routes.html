  <script>
    (function () {
      // deterministic route network (seeded LCG): static decoration, built once
      let s = 1903;
      function rnd() { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }
      const net = document.querySelector("#rt-net");
      const NS = "http://www.w3.org/2000/svg";
      for (let i = 0; i < 150; i++) {
        const x1 = 80 + rnd() * 1760, y1 = 140 + rnd() * 500;
        const x2 = 80 + rnd() * 1760, y2 = 140 + rnd() * 500;
        const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 60 - Math.abs(x2 - x1) * 0.18;
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", "M " + x1.toFixed(1) + " " + y1.toFixed(1) + " Q " + mx.toFixed(1) + " " + my.toFixed(1) + " " + x2.toFixed(1) + " " + y2.toFixed(1));
        p.setAttribute("class", "rt-route");
        p.setAttribute("pathLength", "1");
        p.style.opacity = (0.25 + rnd() * 0.35).toFixed(2);
        net.appendChild(p);
      }
      const tl = gsap.timeline({ paused: true });
      // the 1903 flight path pulls back to become one route among many
      tl.fromTo("#rt-zoom", { scale: 1, x: 0, y: 0, svgOrigin: "945 630" }, { scale: 0.32, x: -330, y: -250, svgOrigin: "945 630", duration: 1.6, ease: "power2.inOut" }, 0.1);

      tl.fromTo("#rt-kick", { opacity: 0, filter: "blur(6px)" }, { opacity: 0.85, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 1.6);
      tl.fromTo("#rt-num", { opacity: 0, filter: "blur(10px)", scale: 0.9, transformOrigin: "0% 100%" }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.3, ease: "expo.out" }, 2.0);
      tl.fromTo("#rt-unit", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.25);
      // blur swap out
      tl.to(["#rt-art-in", "#rt-text"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 6.75);
      window.__timelines["routes"] = tl;
    })();
