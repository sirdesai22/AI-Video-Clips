  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const foils = ["#tn-f0", "#tn-f1", "#tn-f2", "#tn-f3", "#tn-f4", "#tn-f5"];
      tl.set(foils, { opacity: 0 }, 0);
      // the first wing draws on where the bird's wing left off
      tl.set("#tn-f5", { opacity: 1 }, 0);
      tl.fromTo("#tn-f5", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 0);
      tl.fromTo(["#tn-box", "#tn-fan", "#tn-blades"], { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut", stagger: 0.12 }, 0.3);
      tl.fromTo("#tn-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 0.85, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.8);

      tl.fromTo("#tn-blades", { rotation: 0, svgOrigin: "240 530" }, { rotation: 1440, svgOrigin: "240 530", duration: 6, ease: "power1.in" }, 1.0);
      // slot machine through wing shapes while the count runs to 200
      const t0 = 1.2, step = 0.16, n = 20;
      let prev = "#tn-f5";
      for (let i = 0; i < n; i++) {
        const cur = i === n - 1 ? "#tn-f5" : foils[i % 5];
        tl.set(prev, { opacity: 0 }, t0 + i * step);
        tl.set(cur, { opacity: 1 }, t0 + i * step);
        prev = cur;
      }
      const c = { v: 1 };
      tl.fromTo(c, { v: 1 }, {
        v: 200, duration: n * step, ease: "power1.in",
        onUpdate: function () { document.querySelector("#tn-count").textContent = String(Math.round(c.v)); }
      }, t0);
      tl.fromTo("#tn-line .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power4.out" }, 4.5);

      window.__timelines["tunnel"] = tl;
